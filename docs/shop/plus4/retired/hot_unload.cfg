# DO NOT INSTALL. Retired 2026-10-13: renaming EXTRUDER_UNLOAD at Klipper start races the Box module,
# which registers that command late on some restarts; Klipper then halts with "Existing command
# 'EXTRUDER_UNLOAD' not found in gcode_macro rename". Mid-print filament changes unload hot from the
# slicer's change G-code instead (Plus 4 profile + GCode/ShopHotUnload). Kept for reference only.
#
# Print-shop hot unload: printer side (Qidi Plus 4 with the QIDI Box).
#
# Sticky filaments (matte PETG above all) jam when the Box pulls them out of the toolhead at print
# temperature ("QDE_004_009 Extruder unloading failure"); heating 25-30 C first fixes it every time. The
# slicer's filament-change G-code already unloads hot during a print; this covers every other unload,
# because they all end in EXTRUDER_UNLOAD: the touchscreen and the end G-code (UNLOAD_FILAMENT ->
# UNLOAD_T<n>), and the slicer's Box dialog (EXTRUDER_UNLOAD directly).
#
# Before unloading, the nozzle is heated (never cooled) to the slot's filament as the Box knows it: its
# lowest temperature + 30 C, at least its highest and at most 10 C above it (PETG-Tough 240-275: 275 C);
# the same rule as the slicer. A slot the Box has no filament for uses the current target (or the last
# print temperature) + 30 C. Afterwards the nozzle goes back to the target it had, so an unload from a cold
# nozzle does not leave the heater on.
#
# (Was: append this file to gcode_macro.cfg; it renamed the Box's own EXTRUDER_UNLOAD command to
# _SHOP_QIDI_EXTRUDER_UNLOAD. Do not install; see the warning at the top.)

[gcode_macro EXTRUDER_UNLOAD]
rename_existing: _SHOP_QIDI_EXTRUDER_UNLOAD
description: Shop: unload hot (heat to the filament's unload temperature first), then the Box's unload
gcode:
    {% set slot = params.SLOT|default('')|string %}
    {% set prev = printer.extruder.target|float %}
    {% set mcc = printer['multi_color_controller'] if 'multi_color_controller' in printer else {} %}
    {% set mats = mcc.slots.materials if mcc and mcc.slots and mcc.slots.materials else {} %}
    {% set mat = mats[slot] if slot in mats else None %}
    {% if mat and mat.filament and mat.filament.max_temp|float > 0 %}
        {% set lo = mat.filament.min_temp|float %}
        {% set hi = mat.filament.max_temp|float %}
        {% set hot = [[lo + 30, hi]|max, hi + 10, 300]|min %}
    {% else %}
        {% set base = prev if prev > 0 else printer.save_variables.variables.print_temp|default(0)|float %}
        {% set hot = [base + 30, 300]|min if base > 0 else 0 %}
    {% endif %}
    {% if hot > prev %}
        RESPOND MSG="Shop: unloading {slot} at {hot|int} C"
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={hot}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot - 2}
    {% endif %}
    _SHOP_QIDI_EXTRUDER_UNLOAD {rawparams}
    {% if hot > prev %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={prev}
    {% endif %}
