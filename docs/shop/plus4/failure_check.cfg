# Print-shop failure check: printer side (Qidi Plus 4).
#
# The slicer inserts "SHOP_CHECKPOINT N=<n> TIMEOUT=<s>" lines into a job when "Failure check" is ticked
# in the Print dialog. At each one the printer retracts, lifts, parks at the purge chute (out of the
# camera's view, the same spot and moves as Qidi's PAUSE) and waits. The slicer takes a photo and answers
# with SHOP_CHECK_OK (resume) or SHOP_CHECK_HOLD (stay paused and beep). With no answer within TIMEOUT
# seconds the printer resumes on its own, so a closed slicer or a Wi-Fi drop never strands a print.
#
# The checkpoint saves the same G-code states and RESUME_PRINT variables as Qidi's PAUSE, so pressing
# Resume on the touchscreen during a checkpoint or a hold works too (with Qidi's usual purge and wipe).
#
# Install: append this file to gcode_macro.cfg (it needs Qidi's PAUSE/RESUME macros, which rename the
# stock ones to BASE_PAUSE/BASE_RESUME), then restart Klipper. Nothing here runs unless a job or the
# slicer calls it.

[gcode_macro SHOP_CHECKPOINT]
description: Shop failure check: park for a camera photo and wait for the slicer
variable_waiting: 0
variable_held: 0
variable_index: -1
variable_etemp: 0
gcode:
    {% set n = params.N|default(0)|int %}
    {% set timeout = params.TIMEOUT|default(45)|int %}
    {% if printer.print_stats.state == "printing" and printer.pause_resume.is_paused|int == 0 %}
        {% set lift = [[5, printer.toolhead.axis_maximum.z - printer.toolhead.position.z - 2]|min, 0]|max %}
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=zhop VALUE=0
        SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=efan VALUE={printer["fan_generic cooling_fan"].speed * 255}
        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        M83
        G1 E-1.5 F1800
        {% if lift > 0 %}
            G91
            G1 Z{lift} F900
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSEPARK2
        G90
        G1 X95 F12000
        G1 Y312 F12000
        G1 Y316 F600
        G1 Y320 F9000
        G1 Y324 F600
        M400
        G4 P800
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=index VALUE={n}
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=held VALUE=0
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=waiting VALUE=1
        UPDATE_DELAYED_GCODE ID=_SHOP_CHECK_TIMEOUT DURATION={timeout}
    {% endif %}

[gcode_macro SHOP_CHECK_OK]
description: Shop failure check: return to the print and resume
gcode:
    {% set sc = printer["gcode_macro SHOP_CHECKPOINT"] %}
    {% if (sc.waiting|int == 1 or sc.held|int == 1) and printer.pause_resume.is_paused|int == 1 %}
        UPDATE_DELAYED_GCODE ID=_SHOP_CHECK_TIMEOUT DURATION=0
        UPDATE_DELAYED_GCODE ID=_SHOP_CHECK_COOL DURATION=0
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=waiting VALUE=0
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=held VALUE=0
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if printer.extruder.target < sc.etemp %}
            M109 S{sc.etemp}
        {% endif %}
        G90
        G1 Y316 F9000
        G1 Y312 F600
        G1 Y260 F12000
        RESTORE_GCODE_STATE NAME=PAUSEPARK2 MOVE=1 MOVE_SPEED=200
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=15
        M83
        G1 E1.5 F1800
        RESTORE_GCODE_STATE NAME=PAUSE
        BASE_RESUME
    {% endif %}

[gcode_macro SHOP_CHECK_HOLD]
description: Shop failure check found a problem: stay paused and beep
gcode:
    {% set sc = printer["gcode_macro SHOP_CHECKPOINT"] %}
    {% if sc.waiting|int == 1 %}
        UPDATE_DELAYED_GCODE ID=_SHOP_CHECK_TIMEOUT DURATION=0
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=waiting VALUE=0
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=held VALUE=1
        SET_IDLE_TIMEOUT TIMEOUT=86400
        M118 Shop failure check: possible print failure, paused. Check the printer.
        BEEP I=3 DUR=300
        UPDATE_DELAYED_GCODE ID=_SHOP_CHECK_COOL DURATION=900
    {% endif %}

[delayed_gcode _SHOP_CHECK_TIMEOUT]
gcode:
    {% if printer["gcode_macro SHOP_CHECKPOINT"].waiting|int == 1 %}
        M118 Shop failure check: no answer from the slicer, resuming
        SHOP_CHECK_OK
    {% endif %}

[delayed_gcode _SHOP_CHECK_COOL]
gcode:
    {% if printer["gcode_macro SHOP_CHECKPOINT"].held|int == 1 and printer.pause_resume.is_paused|int == 1 %}
        M104 S0
        M118 Shop failure check: hotend off after 15 minutes paused (Resume reheats it)
    {% endif %}

[gcode_macro SHOP_CAMERA_POSE]
description: Shop camera calibration: move the bed and toolhead to a known pose (printer idle only)
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        _SHOP_CAMERA_POSE_MOVE X={params.X|default(95)|float} Y={params.Y|default(324)|float}{(" Z=" ~ params.Z) if params.Z is defined else ""}
    {% else %}
        {action_raise_error("SHOP_CAMERA_POSE: the printer is busy")}
    {% endif %}

[gcode_macro _SHOP_CAMERA_POSE_MOVE]
gcode:
    {% set x = params.X|default(95)|float %}
    {% set y = params.Y|default(324)|float %}
    G90
    {% if printer.toolhead.position.y > 305 %}
        G1 Y312 F600
    {% endif %}
    {% if params.Z is defined %}
        G1 Z{params.Z|float} F900
    {% endif %}
    {% if y > 305 %}
        G1 X{x} Y312 F12000
        G1 Y{y} F600
    {% else %}
        G1 X{x} Y{y} F12000
    {% endif %}
    M400
    G4 P500
