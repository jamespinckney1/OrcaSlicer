# Print-shop quick restart: printer side (Qidi Plus 4).
#
# A print that goes wrong in its first 3 layers is paused (a failure-check hold or a normal pause), the plate is
# cleared while it stays on the bed, and Resume prints the same job again from layer 1: quick purge at the chute,
# no homing, no leveling, no start G-code. Klipper's M26 sets a paused virtual-SD print's file position, so the
# job is rewound in place; homing, the loaded bed mesh, the measured nozzle height (Z offset), the Box tool map
# and the end G-code stay exactly as they were.
#
# The slicer marks each job it uploads (src/slic3r/GUI/ShopQuickRestart.hpp):
#   SHOP_RESTART_POINT POS=<byte offset>   just before layer 1 (before the failure check's reference photo)
#   SHOP_RESTART_LIMIT                     at layer 4, or before the first filament change if that comes earlier
#
# Use (slicer, Fluidd or the console), with the print paused:
#   SHOP_QUICK_RESTART           keeps the hotend and bed at their layer-1 temperatures, lowers the bed for room
#                                and asks for the plate to be cleared (leave it on the bed)
#   RESUME / SHOP_QUICK_RESTART_RESUME   reheats, quick purge, prints again from layer 1. The touchscreen's
#                                Resume works too (quick_restart.patch adds the check to RESUME).
#   SHOP_QUICK_RESTART_CANCEL    changes your mind: the print stays paused and a normal Resume continues it
#
# Install: append this file to gcode_macro.cfg after failure_check.cfg (it uses Qidi's PAUSE/RESUME macros, which
# rename the stock ones to BASE_PAUSE/BASE_RESUME, and the failure check's SHOP_CHECKPOINT), apply
# quick_restart.patch (RESUME hands an armed restart over; CANCEL_PRINT disarms it), then restart Klipper.
# Nothing here runs unless a job or a person calls it. It renames no command.
#
# Power-loss recovery: Qidi's virtual_sdcard counts executed lines for it and M26 does not reset that count, so
# after a quick restart a power-loss recovery of the same print would resume too late. Reprint instead.

[gcode_macro SHOP_RESTART_POINT]
description: Shop quick restart: marks the start of layer 1 (inserted by the slicer)
variable_pos: -1
variable_size: -1
variable_ok: 0
variable_etemp: 0
variable_btemp: 0
variable_fan: 0
variable_pa: 0
variable_restarts: 0
gcode:
    {% set pos = params.POS|default(-1)|int %}
    {% set sd = printer.virtual_sdcard %}
    {% if pos != sd.file_position|int %}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=ok VALUE=0
        M118 Quick restart is off for this print: the marker says byte {pos}, the file is at {sd.file_position}
    {% elif printer.gcode_move.absolute_extrude %}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=ok VALUE=0
        M118 Quick restart is off for this print: it uses absolute extrusion
    {% else %}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=pos VALUE={pos}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=size VALUE={sd.file_size|int}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=btemp VALUE={printer.heater_bed.target}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=fan VALUE={printer["fan_generic cooling_fan"].speed}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=pa VALUE={printer.extruder.pressure_advance}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=ok VALUE=1
    {% endif %}

[gcode_macro SHOP_RESTART_LIMIT]
description: Shop quick restart: past this point a restart is no longer offered (inserted by the slicer)
gcode:
    SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=ok VALUE=0

[gcode_macro SHOP_QUICK_RESTART]
description: Quick restart: while paused in the first 3 layers, clear the plate (leave it on the bed), then Resume to print again from layer 1
variable_armed: 0
variable_at: -1
gcode:
    {% set rp = printer["gcode_macro SHOP_RESTART_POINT"] %}
    {% set sd = printer.virtual_sdcard %}
    {% if printer.print_stats.state != "paused" or printer.pause_resume.is_paused|int == 0 %}
        {action_raise_error("Quick restart: the printer is not paused")}
    {% elif rp.ok|int != 1 or rp.size|int != sd.file_size|int or sd.file_position|int <= rp.pos|int %}
        {action_raise_error("Quick restart: only in the first 3 layers, before the first filament change, of a job the shop slicer marked")}
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Quick restart: the printer is no longer homed; cancel and print again")}
    {% else %}
        # Nothing may resume the abandoned layer meanwhile: no checkpoint timeout, no hold cool-down.
        UPDATE_DELAYED_GCODE ID=_SHOP_CHECK_TIMEOUT DURATION=0
        UPDATE_DELAYED_GCODE ID=_SHOP_CHECK_COOL DURATION=0
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=waiting VALUE=0
        SET_GCODE_VARIABLE MACRO=SHOP_CHECKPOINT VARIABLE=held VALUE=0
        SET_IDLE_TIMEOUT TIMEOUT=86400
        SET_GCODE_VARIABLE MACRO=SHOP_QUICK_RESTART VARIABLE=armed VALUE=1
        SET_GCODE_VARIABLE MACRO=SHOP_QUICK_RESTART VARIABLE=at VALUE={sd.file_position|int}
        # Warm while the plate is cleared (a pause or a 15-minute hold may have turned the hotend off).
        M104 S{rp.etemp}
        M140 S{rp.btemp}
        # Room to scrape: the bed goes down to at least 60 mm (the toolhead stays parked over the chute).
        {% if printer.toolhead.position.z < 60 %}
            G90
            G1 Z60 F600
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_SHOP_RESTART_COOL DURATION=1800
        M117 Clear the plate (leave it on the bed), then Resume
        M118 Quick restart: clear the plate without removing it, then press Resume (reheat, quick purge, layer 1 again)
        BEEP I=1 DUR=200
    {% endif %}

# Runs only for the very pause SHOP_QUICK_RESTART prepared (same file, same position), so a later print never
# inherits an armed restart.
[gcode_macro SHOP_QUICK_RESTART_RESUME]
description: Quick restart: reheat, quick purge and print again from layer 1 (after SHOP_QUICK_RESTART)
gcode:
    {% set qr = printer["gcode_macro SHOP_QUICK_RESTART"] %}
    {% set rp = printer["gcode_macro SHOP_RESTART_POINT"] %}
    {% set sd = printer.virtual_sdcard %}
    {% if qr.armed|int != 1 or printer.pause_resume.is_paused|int == 0 or qr.at|int != sd.file_position|int or rp.size|int != sd.file_size|int %}
        {action_raise_error("Quick restart: not prepared for this pause; run SHOP_QUICK_RESTART first")}
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Quick restart: the printer is no longer homed; cancel and print again")}
    {% else %}
        UPDATE_DELAYED_GCODE ID=_SHOP_RESTART_COOL DURATION=0
        SET_GCODE_VARIABLE MACRO=SHOP_QUICK_RESTART VARIABLE=armed VALUE=0
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        M117 Quick restart: heating and purging
        M118 Quick restart: reheating, quick purge, then layer 1 again (no re-leveling)
        M140 S{rp.btemp}
        M109 S{rp.etemp}
        {% if rp.btemp|float > 0 %}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={rp.btemp|float - 2}
        {% endif %}
        # The print's coordinate and extrusion modes, without moving.
        RESTORE_GCODE_STATE NAME=PAUSE
        G90
        M83
        # Quick purge at the chute: Qidi's resume purge with 30 mm instead of 50, then its wipe.
        {% if printer.toolhead.position.y < 305 %}
            G1 X95 Y312 F12000
        {% endif %}
        G1 X95 F12000
        G1 Y324 F600
        M106 S0
        G92 E0
        G1 E5 F50
        G1 E30 F200
        G1 E-0.8 F200
        G4 P300
        M106 S255
        G1 Y318 F30000
        G1 Y322 F3000
        G1 Y318 F30000
        G1 Y322 F3000
        G1 Y318 F30000
        G1 Y322 F3000
        G1 Y324 F600
        G1 X58 F12000
        G1 X78 F12000
        G1 X58 F12000
        G1 X78 F12000
        G1 X58 F12000
        G1 X78 F12000
        G1 X95 F12000
        G1 Y316 F9000
        G1 Y312 F600
        G1 Y260 F12000
        # Bed back up near the nozzle (the plate is clear), so the reference photo and layer 1 start as usual.
        G1 Z10 F600
        G92 E0
        M106 S{(rp.fan|float * 255)|int}
        SET_PRESSURE_ADVANCE ADVANCE={rp.pa}
        SET_GCODE_VARIABLE MACRO=SHOP_RESTART_POINT VARIABLE=restarts VALUE={rp.restarts|int + 1}
        # BASE_RESUME returns to PAUSE_STATE before reading on; saved here, that return is no move at all instead of
        # a trip back to the abandoned layer. The job's own moves then take the nozzle down to layer 1.
        SAVE_GCODE_STATE NAME=PAUSE_STATE
        M26 S{rp.pos}
        M117
        BASE_RESUME
        ENABLE_ALL_SENSOR
    {% endif %}

[gcode_macro SHOP_QUICK_RESTART_CANCEL]
description: Quick restart: never mind; the print stays paused and a normal Resume continues it
gcode:
    UPDATE_DELAYED_GCODE ID=_SHOP_RESTART_COOL DURATION=0
    SET_GCODE_VARIABLE MACRO=SHOP_QUICK_RESTART VARIABLE=armed VALUE=0
    M117
    M118 Quick restart cancelled; the print is still paused

[delayed_gcode _SHOP_RESTART_COOL]
gcode:
    {% if printer["gcode_macro SHOP_QUICK_RESTART"].armed|int == 1 and printer.pause_resume.is_paused|int == 1 %}
        M104 S0
        M118 Quick restart: hotend off after 30 minutes waiting (Resume reheats it)
    {% endif %}
